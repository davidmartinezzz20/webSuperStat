# Sube la web a PiensaSolutions por FTP en cada push a main.
#
# No hay build: lo que hay en el repositorio es exactamente lo que se sirve, así
# que esto es una copia. `exclude` es lo que no tiene que salir del repositorio
# —las herramientas, la prueba y los metadatos de git—, porque subirlo no rompe
# nada pero deja en un servidor público archivos que no pintan nada ahí.
#
# Las cuatro credenciales son secretos del repositorio
# (Settings → Secrets and variables → Actions), nunca del código:
#
#   FTP_SERVER     el host FTP de PiensaSolutions (p. ej. ftp.superstat.online)
#   FTP_USERNAME   el usuario FTP
#   FTP_PASSWORD   su contraseña
#   FTP_DIR        la raíz web del dominio
#
# FTP_DIR es el único de los cuatro que falla en silencio: con la carpeta
# equivocada el despliegue sale en verde y la web no cambia. Suele llamarse
# public_html, pero también httpdocs, www o web, y hay cuentas FTP que entran ya
# dentro de la raíz, en cuyo caso el valor es «/». Cómo averiguarlo sin adivinar,
# en el README.
#
# Antes del primer despliegue hay que haber quitado WordPress de la raíz web.
# Mientras sigan ahí su index.php y su .htaccess, el servidor manda todas las
# peticiones a WordPress y el index.html nuevo no llega a verse. El orden está
# en el README.
name: Desplegar

on:
  push:
    branches: [main]
  # Para poder relanzarlo a mano desde la pestaña Actions sin tener que hacer
  # un commit vacío.
  workflow_dispatch:

# Dos despliegues a la vez sobre el mismo FTP se pisan a media subida.
concurrency:
  group: despliegue-ftp
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la web antes de subirla
        run: node test/web.js

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_DIR }}
          # La acción lleva la cuenta de lo ya subido en un archivo suyo, así
          # que después del primer despliegue solo viajan los cambios.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            test/**
            tools/**
            package.json
            README.md
